<section class="hero">
  <div class="hero__text">
    <h1 class="hero__title">Collect Feedback, Unlock Ideas</h1>
    <img
      class="hero__visual-mobile"
      src="img/visual-mobile.png"
      alt=""
      width="343"
      height="250"
    />
    <p class="hero__lead">
      Create and share surveys in minutes – from team events to workplace culture. Collect
      opinions, engage your audience, and turn feedback into action.
    </p>
    <button type="button" class="btn-primary hero__cta" (click)="openCreateDialog()">
      New survey
      <span class="btn-primary__icon icon-add-circle" aria-hidden="true"></span>
    </button>
  </div>

  <div class="hero__visual" aria-hidden="true">
    <div class="hero__state hero__state--default">
      <img class="hero__check" src="img/visual-check-default.svg" alt="" width="80" height="81" />
      <img class="hero__phone" src="img/visual-default.png" alt="" width="420" height="420" />
      <img
        class="hero__bubble"
        src="img/visual-bubble-default.svg"
        alt=""
        width="105"
        height="76"
      />
    </div>
    <div class="hero__state hero__state--hover">
      <img class="hero__check" src="img/visual-check-hover.svg" alt="" width="94" height="95" />
      <img class="hero__phone" src="img/visual-hover.png" alt="" width="420" height="420" />
      <img
        class="hero__bubble"
        src="img/visual-bubble-hover.svg"
        alt=""
        width="177"
        height="115"
      />
    </div>
  </div>
</section>
