<div class="home">
  <header class="home__header page-container">
    <a routerLink="/" class="home__logo">
      <img src="img/logo-orange.svg" alt="Poll App" width="119" height="50" />
    </a>
  </header>

  <main class="home__main page-container">
    <app-hero />

    <section class="home__surveys" aria-labelledby="your-surveys-title">
      <div class="home__highlights">
        <h2 id="your-surveys-title" class="home__surveys-title">Your surveys</h2>
        <app-ending-soon [surveys]="surveyService.endingSoon()" />
      </div>
      <app-survey-list [surveys]="surveyService.sortedSurveys()" />
    </section>
  </main>
</div>
