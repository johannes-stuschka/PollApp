<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="create-title">
  <img class="overlay__logo" src="img/logo-dark.svg" alt="Poll App" width="119" height="50" />

  <form class="dialog" [formGroup]="form" (ngSubmit)="publish()">
    <div class="dialog__content">
      <div class="dialog__head">
        <div class="dialog__heading">
          <span class="status-badge status-badge--draft">Draft</span>
          <h2 id="create-title" class="dialog__title">Create new survey</h2>
        </div>
        <button type="button" class="btn-secondary dialog__cancel" aria-label="Cancel" (click)="cancel()">
          <span class="dialog__cancel-text">Cancel</span>
          <span class="icon-close" aria-hidden="true"></span>
        </button>
      </div>

      <div class="dialog__fields">
        <div class="dialog__meta">
          <div class="field field--name">
            <label class="field__label" for="survey-name">
              Survey name <span class="field__required" aria-hidden="true">*</span>
            </label>
            <input
              id="survey-name"
              class="text-field field__input"
              formControlName="title"
              [class.text-field--error]="form.controls.title.touched && form.controls.title.invalid"
              [attr.aria-invalid]="form.controls.title.touched && form.controls.title.invalid"
              [placeholder]="
                form.controls.title.touched && form.controls.title.invalid
                  ? 'Please enter a survey name.'
                  : 'e.g. Team event 2026'
              "
              [maxlength]="maxLength.title"
              required
            />
            <span class="char-count" aria-hidden="true">
              {{ form.controls.title.value.length }}/{{ maxLength.title }}
            </span>
            <button
              type="button"
              class="btn-delete field__delete"
              aria-label="Clear survey name"
              (click)="clearField('title')"
            ></button>
          </div>

          <app-category-dropdown
            class="dialog__category category-dropdown--flush"
            [class.category-dropdown--error]="form.controls.category.touched && form.controls.category.invalid"
            label="Choose category *"
            [categories]="categories"
            [selected]="form.controls.category.value"
            (selectedChange)="selectCategory($event)"
          />

          <div class="field field--date">
            <label class="field__label" for="survey-end-date">
              Set end date <span class="field__optional">(optional)</span>
            </label>
            <input
              id="survey-end-date"
              type="date"
              class="text-field field__input"
              [min]="today"
              formControlName="endDate"
            />
            <button
              type="button"
              class="btn-delete field__delete"
              aria-label="Clear end date"
              (click)="clearField('endDate')"
            ></button>
          </div>

          <div class="field field--description">
            <label class="field__label" for="survey-description">
              Describing text <span class="field__optional">&nbsp;(optional)</span>
            </label>
            <textarea
              id="survey-description"
              class="text-field field__input"
              formControlName="description"
              placeholder="What is this survey about?"
              [maxlength]="maxLength.description"
            ></textarea>
            <span class="char-count" aria-hidden="true">
              {{ form.controls.description.value.length }}/{{ maxLength.description }}
            </span>
            <button
              type="button"
              class="btn-delete field__delete"
              aria-label="Clear describing text"
              (click)="clearField('description')"
            ></button>
          </div>
        </div>

        <div class="dialog__questions">
          @for (question of questions.controls; track question; let i = $index) {
            <app-question-editor [group]="question" [number]="i + 1" (remove)="removeQuestion(i)" />
          }
          <button type="button" class="btn-secondary dialog__add-question" (click)="addQuestion()">
            Add next question
            <span class="icon-add-circle" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>

    <button
      type="submit"
      class="btn-primary dialog__publish"
      [class.btn-primary--inactive]="form.invalid"
      [attr.aria-disabled]="form.invalid"
      [disabled]="isSaving()"
    >
      Publish
      <span class="btn-primary__icon icon-check" aria-hidden="true"></span>
    </button>

    @if (isPublished()) {
      <app-published-toast (closed)="closeToast()" />
    }
  </form>
</div>
